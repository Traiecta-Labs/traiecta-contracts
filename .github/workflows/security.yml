name: security
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  FOUNDRY_VERSION: v1.5.1
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 'true'
  SLITHER_VERSION: 0.11.6
jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: false
        persist-credentials: false
    - name: Install cargo-audit
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
      with:
        tool: cargo-audit
    - name: Audit the committed lockfile
      run: 'set -o pipefail

        cargo audit --file soroban/Cargo.lock | tee cargo-audit.txt

        '
    - name: Summarise
      if: always()
      run: "set -uo pipefail\n{\n  echo \"### cargo audit\"\n  echo\n  if [ -s cargo-audit.txt\
        \ ]; then\n    echo '```'\n    cat cargo-audit.txt\n    echo '```'\n  else\n\
        \    echo \"No output. cargo-audit did not run.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: false
        persist-credentials: false
    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: packages/protocol/package-lock.json
    - name: Audit the protocol package
      working-directory: packages/protocol
      run: 'set -o pipefail

        npm audit --audit-level=high | tee npm-audit.txt

        '
    - name: Summarise
      if: always()
      working-directory: packages/protocol
      run: "set -uo pipefail\n{\n  echo \"### npm audit, packages/protocol\"\n  echo\n\
        \  echo \"Threshold is high. Every dependency here is a build time devDependency;\
        \ the\"\n  echo \"published package has no runtime dependencies.\"\n  echo\n\
        \  if [ -s npm-audit.txt ]; then\n    echo '```'\n    cat npm-audit.txt\n\
        \    echo '```'\n  else\n    echo \"No output.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
  slither:
    name: slither
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Check out, submodules included
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
      with:
        version: ${{ env.FOUNDRY_VERSION }}
        cache: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.11'
    - name: Install Slither
      run: pip install slither-analyzer==${{ env.SLITHER_VERSION }}
    - name: Compile with the pinned toolchain
      working-directory: evm
      run: forge build --build-info
    - name: Slither
      id: slither
      working-directory: evm
      run: "set -o pipefail\nslither . \\\n  --checklist \\\n  --filter-paths \"lib/|test/\"\
        \ \\\n  --exclude arbitrary-send-eth,incorrect-equality,uninitialized-local,unused-return\
        \ \\\n  --fail-medium | tee slither-report.md\n"
    - name: Put the checklist in the summary
      if: always()
      working-directory: evm
      run: "set -uo pipefail\n{\n  echo \"### Slither\"\n  echo\n  if [ -s slither-report.md\
        \ ]; then\n    cat slither-report.md\n  else\n    echo \"Slither produced\
        \ no report. It probably failed before analysis.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
