name: soroban
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  STELLAR_CLI_VERSION: 28.1.0
  STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
  CARGO_TERM_COLOR: always
jobs:
  soroban:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: soroban
    steps:
    - name: Check out
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      with:
        submodules: false
        persist-credentials: false
    - name: Install the toolchain the repository pins
      run: 'rustup toolchain install --profile minimal

        rustup show

        cargo --version

        rustc --version

        '
    - name: Restore the cargo cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: soroban -> target
        shared-key: soroban
    - name: cargo fmt
      run: cargo fmt --all --check
    - name: cargo clippy
      run: cargo clippy --locked --workspace --all-targets -- -D warnings
    - name: cargo test
      run: cargo test --locked --workspace
    - name: Restore the pinned stellar-cli
      id: stellar-cli-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.local/bin/stellar
        key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}-x86_64-unknown-linux-gnu
    - name: Install stellar-cli
      if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
      working-directory: ${{ runner.temp }}
      run: "set -euo pipefail\nmkdir -p \"$HOME/.local/bin\"\ntarball=\"stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz\"\
        \ncurl --fail --silent --show-error --location --retry 3 \\\n  --output \"\
        $tarball\" \\\n  \"https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${tarball}\"\
        \n# If this check fails the job stops here rather than building a contract\
        \ with a binary\n# nobody can account for.\necho \"${STELLAR_CLI_SHA256} \
        \ ${tarball}\" | sha256sum --check --strict\ntar -xzf \"$tarball\" -C \"$HOME/.local/bin\"\
        \ stellar\nchmod +x \"$HOME/.local/bin/stellar\"\n"
    - name: Put stellar on PATH and report the version
      run: 'echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        "$HOME/.local/bin/stellar" --version

        '
    - name: Build the contracts and hold them to the 64KB ledger limit
      working-directory: .
      run: script/stellar/build.sh
    - name: Report the wasm sizes
      if: always()
      working-directory: .
      run: "set -uo pipefail\nlimit=$((64 * 1024))\nwasm_dir=\"soroban/target/wasm32v1-none/release\"\
        \n{\n  echo \"### Soroban wasm sizes\"\n  echo\n  echo \"The ledger rejects\
        \ a contract whose wasm exceeds 64KB. Anything past about two\"\n  echo \"\
        thirds of that has stopped having room for the next feature.\"\n  echo\n}\
        \ >> \"$GITHUB_STEP_SUMMARY\"\n\nshopt -s nullglob\nfound=0\n{\n  echo \"\
        | contract | bytes | KB | share of the 64KB limit |\"\n  echo \"| --- | ---:\
        \ | ---: | ---: |\"\n} >> \"$GITHUB_STEP_SUMMARY\"\nfor wasm in \"$wasm_dir\"\
        /hyperion_*.wasm; do\n  found=1\n  size=$(stat -c%s \"$wasm\")\n  kb=$(awk\
        \ -v s=\"$size\" 'BEGIN { printf \"%.1f\", s / 1024 }')\n  pct=$((size * 100\
        \ / limit))\n  note=\"\"\n  if [ \"$size\" -gt \"$limit\" ]; then\n    note=\"\
        \ (over the limit, cannot be deployed)\"\n  elif [ \"$size\" -gt $((limit\
        \ * 2 / 3)) ]; then\n    note=\" (running out of room)\"\n  fi\n  printf '|\
        \ `%s` | %s | %s | %s%%%s |\\n' \\\n    \"$(basename \"$wasm\")\" \"$size\"\
        \ \"$kb\" \"$pct\" \"$note\" >> \"$GITHUB_STEP_SUMMARY\"\ndone\n\nif [ \"\
        $found\" -eq 0 ]; then\n  echo \"\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"\
        No wasm was produced. The build step above did not get far enough to emit\
        \ one.\" \\\n    >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Keep the wasm for the run
      if: success()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
      with:
        name: soroban-wasm-${{ github.sha }}
        path: soroban/target/wasm32v1-none/release/hyperion_*.wasm
        if-no-files-found: error
        retention-days: 14
    - name: cargo clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: cargo test
      run: cargo test --workspace --locked
    - name: Check out
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: false
        persist-credentials: false
    - name: Restore the pinned stellar-cli
      id: stellar-cli-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.local/bin/stellar
        key: stellar-cli-${{ env.STELLAR_CLI_VERSION }}-x86_64-unknown-linux-gnu
    - name: Keep the wasm for the run
      if: success()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: soroban-wasm-${{ github.sha }}
        path: soroban/target/wasm32v1-none/release/hyperion_*.wasm
        if-no-files-found: error
        retention-days: 14
