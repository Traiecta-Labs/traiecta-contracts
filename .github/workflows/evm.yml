name: evm
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  FOUNDRY_VERSION: v1.5.1
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 'true'
jobs:
  evm:
    name: fmt, lint, build, test, reports
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: evm
    steps:
    - name: Check out, submodules included
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      with:
        version: ${{ env.FOUNDRY_VERSION }}
        cache: false
    - name: Restore the solc and compilation caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.svm

          evm/cache

          evm/out

          '
        key: foundry-${{ runner.os }}-solc0.8.28-${{ hashFiles('evm/foundry.toml',
          'evm/remappings.txt', 'evm/src/**/*.sol', 'evm/test/**/*.sol', 'evm/script/**/*.sol')
          }}
        restore-keys: 'foundry-${{ runner.os }}-solc0.8.28-

          '
    - name: Report the Foundry version
      run: forge --version
    - name: forge fmt
      run: forge fmt --check
    - name: Set up node for solhint
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: evm/package-lock.json
    - name: Install solhint
      run: npm ci
    - name: solhint
      run: npm run lint
    - name: forge build
      run: forge build
    - name: forge test
      env:
        FOUNDRY_PROFILE: ci
      run: forge test -vvv
    - name: Gas report
      run: 'set -o pipefail

        forge test --gas-report | tee gas-report.txt

        '
    - name: Put the gas report in the summary
      if: always()
      run: "set -uo pipefail\n{\n  echo \"### Gas\"\n  echo\n  if [ -s gas-report.txt\
        \ ]; then\n    echo \"Default profile. Only the router and the rail adapters\
        \ are reported, which is\"\n    echo \"what foundry.toml asks for.\"\n   \
        \ echo\n    echo '```'\n    # The tail rather than a grep for the table. Foundry\
        \ draws these tables with box\n    # characters and has changed the style\
        \ between releases, so a pattern that looked\n    # right once would quietly\
        \ produce an empty section later. The table is always at\n    # the end, and\
        \ the whole output is in the artifact.\n    tail -n 160 gas-report.txt\n \
        \   echo '```'\n  else\n    echo \"No gas report was produced. The test step\
        \ did not get that far.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: forge coverage
      run: 'set -o pipefail

        forge coverage --ir-minimum --report summary --report lcov | tee coverage-summary.txt

        '
    - name: Put the coverage summary in the summary
      if: always()
      run: "set -uo pipefail\n{\n  echo \"### Coverage\"\n  echo\n  if [ -s coverage-summary.txt\
        \ ]; then\n    echo '```'\n    # Same reasoning as the gas table above: take\
        \ the end of the output rather than\n    # trying to match the table's borders.\n\
        \    tail -n 100 coverage-summary.txt\n    echo '```'\n    echo\n    echo\
        \ \"Read the libraries and the adapters. Low coverage on a mock is fine; low\"\
        \n    echo \"coverage on AmountMath or StellarAddress is not.\"\n  else\n\
        \    echo \"No coverage summary was produced.\"\n  fi\n} >> \"$GITHUB_STEP_SUMMARY\"\
        \n"
    - name: Keep the coverage data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: evm-coverage-${{ github.sha }}
        path: 'evm/lcov.info

          evm/coverage-summary.txt

          evm/gas-report.txt

          '
        if-no-files-found: warn
        retention-days: 14
