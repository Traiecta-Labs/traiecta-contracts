name: deploy rehearsal
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  FOUNDRY_VERSION: v1.5.1
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 'true'
jobs:
  rehearsal:
    name: anvil end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Check out, submodules included
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
      with:
        version: ${{ env.FOUNDRY_VERSION }}
        cache: false
    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: Restore the solc and compilation caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.svm

          evm/cache

          evm/out

          '
        key: foundry-${{ runner.os }}-solc0.8.28-${{ hashFiles('evm/foundry.toml',
          'evm/remappings.txt', 'evm/src/**/*.sol', 'evm/test/**/*.sol', 'evm/script/**/*.sol')
          }}
        restore-keys: 'foundry-${{ runner.os }}-solc0.8.28-

          '
    - name: Report the tool versions
      run: 'forge --version

        anvil --version

        cast --version

        node --version

        '
    - name: Build once, up front
      working-directory: evm
      run: forge build
    - name: Rehearse the deployment
      run: script/anvil-e2e.sh
    - name: Dump the logs if it failed
      if: failure()
      run: "set -uo pipefail\nfor log in /tmp/hyperion-anvil.log /tmp/hyperion-rails.log\
        \ /tmp/hyperion-early.log; do\n  if [ -f \"$log\" ]; then\n    echo \"::group::$log\"\
        \n    tail -200 \"$log\"\n    echo \"::endgroup::\"\n  else\n    echo \"$log\
        \ was never written\"\n  fi\ndone\n{\n  echo \"### The deployment rehearsal\
        \ failed\"\n  echo\n  echo \"Reproduce it locally with:\"\n  echo\n  echo\
        \ '```'\n  echo \"script/anvil-e2e.sh\"\n  echo '```'\n  echo\n  echo \"It\
        \ starts its own anvil and needs no configuration. The logs it keeps are under\"\
        \n  echo \"\\`/tmp/hyperion-*.log\\`.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Say so in the summary when it worked
      if: success()
      run: "{\n  echo \"### Deployment rehearsal passed\"\n  echo\n  echo \"Phase\
        \ one deployed and queued, the timelock refused an early phase two, phase\
        \ two\"\n  echo \"executed after the warp and was idempotent on a second run,\
        \ the chain matched the\"\n  echo \"deployment record, and one transfer went\
        \ through the result.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
