name: protocol
on:
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  FOUNDRY_VERSION: v1.5.1
  FOUNDRY_DISABLE_NIGHTLY_WARNING: 'true'
jobs:
  protocol:
    name: check and ABI parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
    - name: Check out, submodules included
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        persist-credentials: false
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
      with:
        version: ${{ env.FOUNDRY_VERSION }}
        cache: false
    - name: Restore the solc and compilation caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.svm

          evm/cache

          evm/out

          '
        key: foundry-${{ runner.os }}-solc0.8.28-${{ hashFiles('evm/foundry.toml',
          'evm/remappings.txt', 'evm/src/**/*.sol', 'evm/test/**/*.sol', 'evm/script/**/*.sol')
          }}
        restore-keys: 'foundry-${{ runner.os }}-solc0.8.28-

          '
    - name: Build the contracts
      working-directory: evm
      run: forge build
    - name: Set up node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: packages/protocol/package-lock.json
    - name: Install
      working-directory: packages/protocol
      run: npm ci
    - name: npm run check
      working-directory: packages/protocol
      run: npm run check
    - name: The committed ABI has to match the build
      working-directory: packages/protocol
      run: "set -euo pipefail\nnpm run gen\n\ndirty=0\nif ! git diff --quiet -- src/abi;\
        \ then\n  dirty=1\nfi\nuntracked=$(git ls-files --others --exclude-standard\
        \ -- src/abi)\nif [ -n \"$untracked\" ]; then\n  dirty=1\nfi\n\nif [ \"$dirty\"\
        \ -ne 0 ]; then\n  echo \"The committed ABI does not match what the current\
        \ contracts compile to.\"\n  echo\n  echo \"Changed:\"\n  git --no-pager diff\
        \ --stat -- src/abi\n  if [ -n \"$untracked\" ]; then\n    echo\n    echo\
        \ \"Generated but never committed:\"\n    echo \"$untracked\"\n  fi\n  echo\n\
        \  echo \"Fix it by running the generator and committing the result, not by\
        \ editing\"\n  echo \"src/abi by hand:\"\n  echo\n  echo \"    cd evm && forge\
        \ build\"\n  echo \"    cd ../packages/protocol && npm run gen\"\n  echo\n\
        \  {\n    echo \"### The committed ABI has drifted\"\n    echo\n    echo \"\
        \\`packages/protocol/src/abi\\` is generated from the Foundry build and does\
        \ not\"\n    echo \"match the current contracts. Run \\`forge build\\` in\
        \ \\`evm\\`, then\"\n    echo \"\\`npm run gen\\` in \\`packages/protocol\\\
        `, and commit what it writes.\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\n  exit 1\n\
        fi\n\necho \"The committed ABI matches the build.\"\n"
    - name: Show the full diff if the generator moved anything else
      if: failure()
      working-directory: packages/protocol
      run: git --no-pager diff -- src/abi || true
